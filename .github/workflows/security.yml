name: Security

# Reusable secret and static analysis scan. Plain containers, pinned by digest: a
# moved tag cannot change what runs, and none of it needs GitHub Advanced Security
# (CodeQL, code scanning and dependency review are paid features on a private
# repository). Semgrep stands in for CodeQL; `npm audit` / govulncheck in ci-node
# and ci-go stand in for dependency review.
#
# A pull request is scanned for its own commits; anything else (the weekly run)
# for the whole history, verified secrets only.
on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-latest
      semgrep-configs:
        description: Space-separated Semgrep rule packs, e.g. "p/default p/typescript p/secrets".
        type: string
        default: p/default p/secrets
      trufflehog-exclude:
        description: File of path regexes TruffleHog skips, relative to the repository (empty = none).
        type: string
        default: .github/trufflehog-exclude.txt

permissions:
  contents: read

jobs:
  scan:
    name: Secrets and SAST
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EXCLUDE: ${{ inputs.trufflehog-exclude }}
        run: |
          if [ -n "$BASE" ]; then
            range=(--since-commit "$BASE" --branch "$HEAD" "--results=verified,unknown")
          else
            range=("--results=verified")
          fi
          exclude=()
          if [ -n "$EXCLUDE" ] && [ -f "$EXCLUDE" ]; then exclude=("--exclude-paths=/repo/$EXCLUDE"); fi
          docker run --rm -v "$PWD:/repo" \
            trufflesecurity/trufflehog:3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a \
            git file:///repo "${range[@]}" "${exclude[@]}" --fail --no-update

      # The binary, not gitleaks-action: the action wants a licence key for an
      # organisation's repositories, the CLI is MIT.
      - name: Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --redact --exit-code 1 /repo

      - name: Semgrep
        env:
          CONFIGS: ${{ inputs.semgrep-configs }}
        run: |
          args=()
          for c in $CONFIGS; do args+=(--config "$c"); done
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b \
            semgrep scan --metrics=off --error "${args[@]}"
