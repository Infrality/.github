name: Deploy production

# Reusable. Production follows main: each application repository's ship.yml builds and
# signs an image on every merge to main and calls this with the signed digest
# (`reference`). Its deploy-prod.yml is the manual button, for a redeploy or a rollback
# to an earlier build (`ref`: a release tag v1.2.3 or a main-<sha7> image tag). The
# organisation is on the Free plan (no Environment approvals, no branch protection), so
# the safeguards are in this file:
#
#   1. it runs for a push to main or a workflow_dispatch on main, nothing else;
#   2. a `reference` must be ghcr.io/infrality/<image>@sha256:…; a `ref` must be a
#      release tag in main's history or a main-<sha7> tag;
#   3. the cosign signature of that digest is verified on the runner BEFORE the
#      network is opened (signed by Infrality's image workflow, nobody else);
#   4. the runner reaches the VPS over the public SSH port (SSH_HOST is the public IP,
#      host key pinned, StrictHostKeyChecking=yes) and runs exactly one command, which
#      the server's infrality-ssh-gate checks again:  deploy.sh <service> <image@sha256:…>
#   5. the server verifies the signature itself, rolls out with no downtime, runs the
#      smoke test and rolls back on failure (platform docs/DEPLOYING.md).
#
# Secrets the caller passes: SSH_DEPLOY_KEY (the key
# whose authorized_keys line carries `infrality-ssh-gate <role>`), SSH_KNOWN_HOSTS
# (the server's host key, from `ssh-keyscan` run from a trusted machine — not fetched
# here, so nothing answering on that address is trusted on first use).
on:
  workflow_call:
    inputs:
      service:
        description: backend | dashboard | website | docs | admin
        type: string
        required: true
      image:
        description: Repository under ghcr.io/infrality/ (api, app, website, docs, admin).
        type: string
        required: true
      ref:
        description: Image tag to deploy (v1.2.3 or main-<sha7>). Ignored when reference is set.
        type: string
        default: ''
      reference:
        description: Signed digest from the image job (ghcr.io/infrality/<image>@sha256:…).
        type: string
        default: ''
      ssh-host:
        description: The VPS's public IP (the SSH_HOST organisation variable).
        type: string
        required: true
      ssh-user:
        type: string
        required: true
      smoke-url:
        description: Optional public URL polled from the runner after the deploy.
        type: string
        default: ''
    secrets:
      SSH_DEPLOY_KEY:
        required: true
      SSH_KNOWN_HOSTS:
        required: true

permissions:
  contents: read

# One deploy of a service at a time, never cancelled halfway.
concurrency:
  group: deploy-prod-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.service }} ${{ inputs.ref || 'from main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: Only from main, for a signed build
        env:
          EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.ref }}
          REFERENCE: ${{ inputs.reference }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ inputs.ssh-host }}
          SSH_USER: ${{ inputs.ssh-user }}
          HAS_KEY: ${{ secrets.SSH_DEPLOY_KEY != '' }}
          HAS_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS != '' }}
        run: |
          set -euo pipefail
          # Unset variables reach ssh as "@" and it only prints its usage line (exit 255).
          missing=()
          [ -n "$SSH_HOST" ] || missing+=("variable SSH_HOST")
          [ -n "$SSH_USER" ] || missing+=("variable SSH_USER")
          [ "$HAS_KEY" = true ] || missing+=("this repository's SSH_DEPLOY_KEY_* secret")
          [ "$HAS_KNOWN_HOSTS" = true ] || missing+=("secret SSH_KNOWN_HOSTS")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::not configured: %s (platform docs/OPERATIONS.md, "CI reaches the VPS")\n' "${missing[@]}"
            exit 1
          fi
          case "$EVENT" in push|workflow_dispatch) ;; *) echo "::error::production deploys run on a push to main or the button, not '$EVENT'"; exit 1 ;; esac
          [ "$WORKFLOW_REF" = refs/heads/main ] || { echo "::error::production deploys run from main, not '$WORKFLOW_REF'"; exit 1; }
          [[ "$SERVICE" =~ ^(backend|dashboard|website|docs|admin)$ ]] || { echo "::error::unknown service '$SERVICE'"; exit 1; }
          [[ "$IMAGE" =~ ^(api|app|website|docs|admin)$ ]] || { echo "::error::unknown image '$IMAGE'"; exit 1; }
          if [ -n "$REFERENCE" ]; then
            [[ "$REFERENCE" =~ ^ghcr\.io/infrality/${IMAGE}@sha256:[0-9a-f]{64}$ ]] || { echo "::error::reference must be ghcr.io/infrality/${IMAGE}@sha256:…, got '$REFERENCE'"; exit 1; }
          elif [[ "$TAG" =~ ^main-[0-9a-f]{7}$ ]]; then
            : # a build of main: its signature (checked next) proves where it came from
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # A release tag only counts if it is in main's history (behind = an ancestor).
            status="$(gh api "repos/${REPO}/compare/main...${TAG}" --jq .status)"
            case "$status" in behind|identical) ;; *) echo "::error::$TAG is not in main's history (compare says '$status')"; exit 1 ;; esac
          else
            echo "::error::ref must be v1.2.3 or main-<sha7>, got '$TAG'"; exit 1
          fi

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Resolve the digest and verify its signature
        env:
          IMAGE: ${{ inputs.image }}
          SERVICE: ${{ inputs.service }}
          TAG: ${{ inputs.ref }}
          REFERENCE: ${{ inputs.reference }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${OWNER,,}/${IMAGE}"
          if [ -n "$REFERENCE" ]; then
            digest="${REFERENCE#*@}"
          else
            digest="$(docker buildx imagetools inspect "${repo}:${TAG#v}" --format '{{.Manifest.Digest}}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image ${repo}:${TAG#v}; was it built?"; exit 1; }
          fi
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "::warning::attempt $i failed"; sleep $((i * 10)); done; return 1; }
          retry cosign verify \
            --certificate-identity-regexp "^https://github\\.com/Infrality/(\\.github|${IMAGE})/\\.github/workflows/image\\.yml@refs/(heads/main|tags/v.+)\$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${repo}@${digest}" > /dev/null
          echo "reference=${repo}@${digest}" >> "$GITHUB_OUTPUT"
          echo "### ${SERVICE} → ${repo}@${digest}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install the deploy key and the pinned host key
        env:
          DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The one command this key may run. The server's gate accepts nothing else
      # from it, and deploy.sh refuses a tag, a foreign repository or an unsigned digest.
      - name: deploy.sh
        env:
          SSH_TARGET: ${{ inputs.ssh-user }}@${{ inputs.ssh-host }}
          SERVICE: ${{ inputs.service }}
          REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=15 "$SSH_TARGET" "deploy.sh ${SERVICE} ${REFERENCE}"

      # deploy.sh judged the result from inside the server; this asks from outside.
      - name: Smoke test from outside
        if: inputs.smoke-url != ''
        env:
          URL: ${{ inputs.smoke-url }}
        run: |
          deadline=$((SECONDS + 120))
          until curl -fsS --max-time 10 -o /dev/null "$URL"; do
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::$URL did not answer"; exit 1; }
            sleep 5
          done

      # Runs even when an earlier step failed, so no key stays on the runner.
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
