name: Feature
description: Something new or better for users or for the platform
title: "feat: "
labels: ["type:feature"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem, who has it, and what it costs today.
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What
      description: The change, as small as it can be while still being useful.
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements. An agent works until every box is true.
      value: |
        - [ ] 
        - [ ] Gate green (`make check` or npm equivalent), tests added for the new behaviour
    validations: { required: true }
  - type: textarea
    id: notes
    attributes:
      label: Notes, constraints, links
      description: Files to start from, compatibility (legacy Netscope agents), security, out of scope.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["P0 — now", "P1 — this cycle", "P2 — later"]
    validations: { required: true }
